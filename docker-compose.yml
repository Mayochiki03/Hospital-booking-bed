services:
  mysql:
    image: mysql:8.4
    container_name: hospital-bed-book-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bed_hospital
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
