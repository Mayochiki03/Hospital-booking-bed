spring.application.name=hospital_bed_book

# Default profile = H2 in-memory database, so the app runs out of the box
# with zero setup (no external database required).
# Use the "mysql" profile (see application-mysql.properties) for MySQL instead:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:h2:mem:bed_hospital;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console for browsing the in-memory database while developing:
# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:bed_hospital)
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.main.banner-mode=off
logging.level.root=INFO
